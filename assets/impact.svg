<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="215" viewBox="0 0 1000 215" role="img" aria-label="Impact: order turnaround 7 days to 1 day across 12 sites, 1,400+ orders a day for 200+ staff, API latency 9 s to 1.3 s, 2+ years in production plus 6 months freelance.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040b1c"/><stop offset="0.55" stop-color="#0a1b38"/><stop offset="1" stop-color="#06122b"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.14"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e3a66"/><stop offset="1" stop-color="#0a2547"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <style>
      .num { font: 800 33px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #ecfeff; }
      .lbl { font: 700 12.5px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #67e8f9; letter-spacing: 1.6px; }
      .sub { font: 400 12.5px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .float { animation: float 4s ease-in-out infinite; }
      .shine { animation: shine 3s ease-in-out infinite; opacity: 0; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes shine { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1000" height="215" rx="18" fill="url(#bg)"/><rect width="1000" height="215" rx="18" fill="url(#dots)"/><rect x="1" y="1" width="998" height="213" rx="17" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
  
  <g class="float" style="animation-delay:0.0s">
    <polygon points="248,34 258,44 258,184 248,174" fill="#04132a" stroke="#22d3ee" stroke-opacity=".4"/>
    <polygon points="28,174 248,174 258,184 38,184" fill="#030e20" stroke="#22d3ee" stroke-opacity=".4"/>
    <rect x="28" y="34" width="220" height="140" rx="6" fill="url(#cardf)" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.4" filter="url(#glow)"/>
    <rect x="28" y="34" width="220" height="3" fill="url(#shine)" class="shine" style="animation-delay:0.0s" clip-path="inset(0 round 6px)"/>
    <text x="138" y="96" text-anchor="middle" class="num" filter="url(#glow)">7d → 1d</text>
    <text x="138" y="128" text-anchor="middle" class="lbl">ORDER TURNAROUND</text>
    <text x="138" y="151" text-anchor="middle" class="sub">paper process → digital, 12 sites</text>
  </g>
  <g class="float" style="animation-delay:0.5s">
    <polygon points="492,34 502,44 502,184 492,174" fill="#04132a" stroke="#22d3ee" stroke-opacity=".4"/>
    <polygon points="272,174 492,174 502,184 282,184" fill="#030e20" stroke="#22d3ee" stroke-opacity=".4"/>
    <rect x="272" y="34" width="220" height="140" rx="6" fill="url(#cardf)" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.4" filter="url(#glow)"/>
    <rect x="272" y="34" width="220" height="3" fill="url(#shine)" class="shine" style="animation-delay:0.6s" clip-path="inset(0 round 6px)"/>
    <text x="382" y="96" text-anchor="middle" class="num" filter="url(#glow)">1,400+</text>
    <text x="382" y="128" text-anchor="middle" class="lbl">ORDERS A DAY</text>
    <text x="382" y="151" text-anchor="middle" class="sub">200+ staff on my FastAPI backend</text>
  </g>
  <g class="float" style="animation-delay:1.0s">
    <polygon points="736,34 746,44 746,184 736,174" fill="#04132a" stroke="#22d3ee" stroke-opacity=".4"/>
    <polygon points="516,174 736,174 746,184 526,184" fill="#030e20" stroke="#22d3ee" stroke-opacity=".4"/>
    <rect x="516" y="34" width="220" height="140" rx="6" fill="url(#cardf)" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.4" filter="url(#glow)"/>
    <rect x="516" y="34" width="220" height="3" fill="url(#shine)" class="shine" style="animation-delay:1.2s" clip-path="inset(0 round 6px)"/>
    <text x="626" y="96" text-anchor="middle" class="num" filter="url(#glow)">9s → 1.3s</text>
    <text x="626" y="128" text-anchor="middle" class="lbl">API LATENCY</text>
    <text x="626" y="151" text-anchor="middle" class="sub">indexes · N+1 fixes · Redis caching</text>
  </g>
  <g class="float" style="animation-delay:1.5s">
    <polygon points="980,34 990,44 990,184 980,174" fill="#04132a" stroke="#22d3ee" stroke-opacity=".4"/>
    <polygon points="760,174 980,174 990,184 770,184" fill="#030e20" stroke="#22d3ee" stroke-opacity=".4"/>
    <rect x="760" y="34" width="220" height="140" rx="6" fill="url(#cardf)" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.4" filter="url(#glow)"/>
    <rect x="760" y="34" width="220" height="3" fill="url(#shine)" class="shine" style="animation-delay:1.7999999999999998s" clip-path="inset(0 round 6px)"/>
    <text x="870" y="96" text-anchor="middle" class="num" filter="url(#glow)">2+ yrs</text>
    <text x="870" y="128" text-anchor="middle" class="lbl">IN PRODUCTION</text>
    <text x="870" y="151" text-anchor="middle" class="sub">backend + AI · + 6 mo freelance</text>
  </g>
</svg>