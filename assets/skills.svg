      .core1 { font: 800 18px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #ecfeff; } .core2 { font: 700 11px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #cffafe; letter-spacing: 2px; }
      .legend { font: 600 12.5px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
