<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Skills orbiting a core. Agentic AI: LangGraph, RAG, tool calling, LLM evals, guardrails. Backend: FastAPI, Django REST, Pydantic, LangChain, RabbitMQ, Socket.IO, JWT and RBAC. Data and infra: PostgreSQL, MongoDB, Redis, Chroma, pgvector, Groq and Llama, LangSmith, AWS Lambda and S3, Docker.">
